<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' https://ims.bdcms.bharatdatacenter.com;">
    <title>Servers - BDC Inventory</title>
    <link rel="stylesheet" href="../../assets/css/tailwind.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script>
        (function () {
            const theme = (localStorage.getItem('theme') || 'light').replace(/^"|"$/g, '');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>

<body class="bg-surface-main">
    <div id="navbar-placeholder"></div>

    <!-- Main Container with Layout Wrapper -->
    <div class="layout-wrapper">
        <div class="main-container flex">
            <!-- Sidebar Content Area (injected here via sidebar-placeholder) -->
            <div id="sidebar-placeholder"></div>

            <!-- Main Content -->
            <main class="main-content flex-1 p-4 sm:p-6 flex flex-col overflow-hidden h-full">
                <!-- Server View -->
                <div id="serverView" class="content-section active overflow-y-auto overflow-x-hidden">
                    <div class="content-header mb-6">
                        <h2 class="text-2xl font-bold text-text-primary mb-4">Servers</h2>
                        <div class="header-actions flex flex-wrap items-center gap-3">
                            <div class="search-filter flex flex-col sm:flex-row gap-3 w-full sm:w-auto sm:flex-1">
                                <input type="text" id="serverSearch" placeholder="Search servers..."
                                    class="px-4 py-2 border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent min-h-[44px] w-full sm:flex-1 bg-surface-card text-text-primary">
                                <select id="serverStatusFilter"
                                    class="px-4 py-2 border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent min-h-[44px] bg-surface-card text-text-primary">
                                    <option value="">All Status</option>
                                    <option value="0">Draft</option>
                                    <option value="1">Validated</option>
                                    <option value="2">Built</option>
                                    <option value="3">Finalized</option>
                                </select>
                            </div>
                            <!-- Shown to everyone. Dashboard.applyServerCreateGate() marks it
                                 request-mode for anyone without server.create: they get the same
                                 flow, and it raises a Request instead of building directly. -->
                            <button
                                class="btn btn-primary px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary-600 transition-colors flex items-center gap-2"
                                id="addServerBtn" style="display: none;">
                                <i class="fas fa-plus"></i> Build Server
                            </button>
                            <button
                                class="btn btn-secondary px-4 py-2 bg-surface-hover text-text-secondary rounded-lg hover:bg-border transition-colors flex items-center gap-2"
                                id="refreshServers">
                                <i class="fas fa-sync-alt"></i> Refresh
                            </button>
                        </div>
                    </div>


                    <!-- Server Grid -->
                    <div class="server-grid grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 grid-gap-responsive"
                        id="serverCardsGrid">
                        <!-- Server cards will be populated here -->
                    </div>
                </div>

                <!-- Server Builder View -->
                <div id="serverBuilderView" class="content-section h-full overflow-hidden">
                    <!-- Header Section -->
                    <div class="content-header mb-6 pb-4 border-b border-border-light">
                        <div class="flex flex-wrap items-center justify-between gap-3">
                            <div class="flex-1 min-w-0">
                                <h2 id="serverBuilderTitle"
                                    class="text-2xl md:text-3xl font-bold text-text-primary mb-1">
                                    <i class="fas fa-wrench"></i> Server Builder
                                </h2>
                                <p class="text-sm text-text-muted">Configure and build your server with selected
                                    components</p>
                            </div>
                            <button
                                class="btn btn-secondary px-4 py-2 bg-surface-hover text-text-secondary rounded-lg hover:bg-border transition-colors flex items-center gap-2 whitespace-nowrap sm:ml-4"
                                onclick="dashboard.showServerView()">
                                <i class="fas fa-arrow-left"></i> Back to Servers
                            </button>
                        </div>
                    </div>

                    <!-- Server Builder Content - Scrollable -->
                    <div id="serverBuilderContent"
                        class="flex-1 overflow-y-auto overflow-x-hidden bg-surface-card rounded-lg shadow-sm p-4 md:p-6 min-h-0">
                        <!-- PC Part Picker builder will be loaded here -->
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal Container -->
    <div id="modalContainer"
        class="modal-overlay fixed inset-0 bg-black/50 flex items-center justify-center z-modal hidden">
        <div class="modal bg-surface-card rounded-lg shadow-xl max-w-6xl w-full mx-4 max-h-[90vh] overflow-hidden">
            <div class="modal-header flex items-center justify-between px-6 py-4 border-b border-border">
                <h3 id="modalTitle" class="text-xl font-semibold text-text-primary">Modal Title</h3>
                <button class="modal-close text-text-muted hover:text-text-primary transition-colors" id="modalClose">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="modal-body overflow-y-auto px-6 py-4 max-h-[calc(90vh-120px)]" id="modalBody">
                <!-- Modal content will be loaded here -->
            </div>
        </div>
    </div>


    <!-- Alert Container -->
    <div id="alertContainer" class="alert-container"></div>

    <!-- Scripts -->
    <!-- Axios 1.6.0, served from this origin. [L-01] It came from
         cdn.jsdelivr.net until 2026-09-13; the copy in assets/vendor was
         downloaded and its SHA-384 checked against the integrity attribute
         that was already here, so it is the same reviewed bytes with one
         fewer party able to change them. The integrity attribute stays:
         it now guards against the file being altered in our own tree. -->
    <script defer src="../../components/global-loading.js"></script>
    <script defer src="../../assets/js/config.js"></script>
    <script defer src="../../assets/js/toast.js"></script>
    <script defer src="../../assets/js/dashboard/utils.js"></script>
    <script defer src="../../assets/js/dashboard/api.js"></script>
    <script defer src="../../assets/js/server/server-api.js?v=6"></script>
    <!-- Required by template-manager.js and platform-manager.js: both install through window.componentInstaller -->
    <script defer src="../../assets/js/server/component-installer.js?v=1"></script>
    <script defer src="../../assets/js/server/template-manager.js?v=4"></script>
    <!-- Required by server-builder.js: its constructor reads BuildState.COMPONENT_CATALOG -->
    <script defer src="../../assets/js/server/build-state.js?v=1"></script>
    <!-- Required by server-builder.js: the compute-platform picker calls window.platformManager -->
    <script defer src="../../assets/js/server/platform-manager.js?v=3"></script>
    <script defer src="../../assets/js/server/server-builder.js?v=8"></script>
    <!-- Sidebar Component and Manager (must load before dashboard) -->
    <script defer src="../../components/sidebar-manager.js"></script>
    <script defer src="../../components/navbar.js"></script>
    <script defer src="../../assets/js/dashboard/dashboard.js"></script>
</body>

</html>
