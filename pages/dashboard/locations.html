<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' https://ims.bdcms.bharatdatacenter.com;">
    <title>Locations - BDC Inventory</title>
    <link rel="stylesheet" href="../../assets/css/tailwind.css">
    <link rel="stylesheet" href="../../assets/css/refined.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script>
        (function () {
            const theme = (localStorage.getItem('theme') || 'light').replace(/^"|"$/g, '');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        /* Locations — the sites racks stand in. Shared pieces from refined.css. */
        .loc-name {
            display: flex; align-items: center; gap: 12px; width: 100%; padding: 0; border: 0; background: none;
            font: inherit; color: inherit; text-align: left; cursor: pointer;
        }
        .loc-caret { flex: none; width: 12px; font-size: 11px; color: var(--color-text-muted); transition: transform .15s ease; }
        tr.is-open .loc-caret { transform: rotate(90deg); }
        .loc-title { display: flex; align-items: center; gap: 10px; font-weight: 600; }
        .loc-desc { display: block; margin-top: 2px; font-size: 12.5px; color: var(--color-text-muted); white-space: normal; }
        .loc-retired { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--color-text-muted); }
        .loc-holds { display: inline-flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--color-text-secondary); }
        .loc-holds b { font-weight: 500; color: var(--color-text-primary); }
        .loc-muted, .loc-muted b { color: var(--color-text-muted) !important; }
        .loc-wrap { white-space: normal !important; min-width: 180px; color: var(--color-text-secondary) !important; }
        .loc-coord { font-size: 12.5px; color: var(--color-text-secondary) !important; }
        .loc-acts { text-align: right; width: 1%; }
        .loc-icon { width: 34px; height: 34px; border-color: transparent; background: transparent; }
        .loc-icon:hover { background: var(--color-surface-hover); }
        .loc-icon.is-danger:hover { color: var(--rf-failed); }
        @media (hover: hover) {
            .loc-acts .loc-icon { opacity: 0; transition: opacity .15s; }
            tr:hover .loc-acts .loc-icon, .loc-acts .loc-icon:focus-visible { opacity: 1; }
        }
        .rf-table td.loc-empty { white-space: normal; height: auto; }

        .rf-table tbody tr.loc-racks-row td { height: auto; padding: 14px 16px 18px 40px; background: var(--color-surface-main); white-space: normal; }
        .rf-table tbody tr.loc-racks-row:hover td { background: var(--color-surface-main); }
        .loc-racks { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
        .loc-rack {
            display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 8px;
            border: 1px solid var(--color-border); background: var(--color-surface-card); color: inherit; text-decoration: none;
        }
        .loc-rack.is-link:hover { border-color: var(--color-border-dark); }
        .loc-rack-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: 12.5px; }
        .loc-rack-name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .loc-rack-bar { display: block; height: 6px; border-radius: 999px; background: var(--color-surface-hover); overflow: hidden; }
        .loc-rack-bar span { display: block; height: 100%; border-radius: 999px; background: var(--rf-available); }
        .loc-rack-meta { font-size: 12px; color: var(--color-text-muted); }
        .loc-foot { font-size: 12.5px; color: var(--color-text-muted); }

        @media (max-width: 767px) {
            .loc-hide-sm { display: none; }
            .rf-table tbody tr.loc-racks-row td { padding-left: 16px; }
        }
    </style>
</head>

<body class="bg-surface-main">
    <div id="navbar-placeholder"></div>

    <!-- Main Container with Layout Wrapper -->
    <div class="layout-wrapper">
        <div class="main-container flex">
            <div id="sidebar-placeholder"></div>

            <!-- Main Content -->
            <main class="main-content flex-1 p-4 sm:p-6">
                <div id="componentView" class="content-section active rf">
                    <div class="rf-head">
                        <div>
                            <h1 id="componentTitle">Locations</h1>
                            <div class="rf-sub">The sites your racks stand in. Every server and part in a rack inherits its location.</div>
                        </div>
                        <div class="rf-actions">
                            <label class="rf-search">
                                <i class="fas fa-search text-xs" aria-hidden="true"></i>
                                <input type="search" id="componentSearch" placeholder="Search locations" aria-label="Search locations by name, description or address" autocomplete="off">
                            </label>
                            <button type="button" id="addLocationBtn" class="rf-btn rf-btn-primary">
                                <i class="fas fa-plus" aria-hidden="true"></i> Add location
                            </button>
                        </div>
                    </div>

                    <section class="rf-card" style="overflow:hidden">
                        <div class="rf-scroll">
                            <table class="rf-table" id="locationsTable">
                                <thead>
                                    <tr>
                                        <th scope="col">Location</th>
                                        <th scope="col">Holds</th>
                                        <th scope="col" class="loc-hide-sm">Address</th>
                                        <th scope="col" class="loc-hide-sm">Coordinates</th>
                                        <th scope="col"><span class="sr-only">Actions</span></th>
                                    </tr>
                                </thead>
                                <tbody id="locationsTableBody">
                                    <tr><td colspan="5" class="rf-state loc-empty">Loading locations…</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </section>
                    <div id="locationPaginationInfo" class="loc-foot"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal Container -->
    <div id="modalContainer"
        class="modal-overlay rf-modal fixed inset-0 bg-black/50 flex items-center justify-center z-modal hidden">
        <div class="modal bg-surface-card rounded-lg shadow-xl max-w-2xl w-full mx-4 max-h-[90vh] overflow-hidden">
            <div class="modal-header flex items-center justify-between px-6 py-4 border-b border-border">
                <h3 id="modalTitle" class="text-xl font-semibold text-text-primary">Modal Title</h3>
                <button class="modal-close text-text-muted hover:text-text-primary transition-colors" id="modalClose" aria-label="Close">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="modal-body overflow-y-auto px-6 py-4 max-h-[calc(90vh-120px)]" id="modalBody">
            </div>
        </div>
    </div>


    <!-- Scripts -->
    <script defer src="../../components/global-loading.js"></script>
    <script defer src="../../assets/js/config.js"></script>
    <script defer src="../../assets/js/toast.js"></script>
    <script defer src="../../assets/js/dashboard/utils.js"></script>
    <script defer src="../../assets/js/dashboard/api.js"></script>
    <script defer src="../../assets/js/dashboard/locations.js"></script>
    <script defer src="../../components/sidebar-manager.js"></script>
    <script defer src="../../components/navbar.js"></script>
    <script defer src="../../assets/js/dashboard/dashboard.js"></script>
</body>

</html>
