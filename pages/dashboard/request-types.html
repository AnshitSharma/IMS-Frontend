<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' https://ims.bdcms.bharatdatacenter.com;">
    <title>Request Types - BDC Inventory</title>
    <link rel="stylesheet" href="../../assets/css/tailwind.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script>
        (function () {
            const theme = (localStorage.getItem('theme') || 'light').replace(/^"|"$/g, '');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        /* Step flow "spine" — the signature element. Step chips connected by a
           directional rail to read as the request's actual flow. Uses the app's
           CSS variables so it tracks light/dark themes automatically. */
        .flow-rail { display: flex; align-items: stretch; gap: 0; flex-wrap: wrap; }
        .flow-node {
            position: relative; display: flex; flex-direction: column; gap: 2px;
            padding: 8px 12px; border: 1px solid var(--color-border, #e5e7eb);
            border-radius: 10px; background: var(--color-surface-secondary, #f8fafc);
            min-width: 0;
        }
        .flow-node + .flow-node { margin-left: 26px; }
        .flow-node + .flow-node::before {
            content: "\f054"; font-family: "Font Awesome 6 Free"; font-weight: 900;
            position: absolute; left: -20px; top: 50%; transform: translateY(-50%);
            font-size: 10px; color: var(--color-text-muted, #94a3b8);
        }
        .flow-node .flow-stage-name { font-size: 12px; font-weight: 600; line-height: 1.2; }
        .flow-node .flow-owner { font-size: 10px; }
        @media (max-width: 640px) {
            .flow-node { width: 100%; }
            .flow-node + .flow-node { margin-left: 0; margin-top: 22px; }
            .flow-node + .flow-node::before { content: "\f078"; left: 50%; top: -18px; transform: translateX(-50%); }
        }
    </style>
</head>

<body class="bg-surface-main">
    <div id="navbar-placeholder"></div>

    <div class="layout-wrapper">
        <div class="main-container flex">
            <div id="sidebar-placeholder"></div>

            <main class="main-content flex-1 p-4 sm:p-6">
                <div id="pipelineTypesView" class="content-section active">
                    <div class="content-header mb-6">
                        <div class="flex flex-wrap items-start justify-between gap-3 mb-1">
                            <div>
                                <h2 class="text-2xl font-bold text-text-primary">Request Types</h2>
                                <p class="text-sm text-text-muted mt-1">Define the steps a request flows through and who owns each one.</p>
                            </div>
                            <div class="flex items-center gap-3">
                                <a href="requests.html" class="px-4 py-2 border border-border rounded-lg hover:bg-surface-hover transition-colors text-text-primary min-h-[44px] flex items-center gap-2">
                                    <i class="fas fa-inbox"></i> <span class="hidden sm:inline">Requests</span>
                                </a>
                                <button id="refreshTypesBtn"
                                    class="px-4 py-2 border border-border rounded-lg hover:bg-surface-hover transition-colors text-text-primary min-h-[44px] min-w-[44px]"
                                    title="Refresh">
                                    <i class="fas fa-sync-alt"></i>
                                </button>
                                <button id="createTypeBtn"
                                    class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary-600 transition-colors flex items-center gap-2 min-h-[44px]">
                                    <i class="fas fa-plus"></i> New Type
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Loading -->
                    <div id="typesLoadingState" class="text-center py-12 hidden">
                        <i class="fas fa-spinner fa-spin text-4xl text-primary mb-4"></i>
                        <p class="text-text-muted">Loading request types...</p>
                    </div>

                    <!-- Error -->
                    <div id="typesErrorState" class="text-center py-12 bg-surface-card rounded-lg hidden">
                        <i class="fas fa-exclamation-triangle text-4xl text-danger mb-4"></i>
                        <p class="text-text-primary font-semibold mb-2">Couldn't load request types</p>
                        <p id="typesErrorMessage" class="text-text-muted mb-4"></p>
                        <button onclick="requestTypesManager.load()" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary-600">Try Again</button>
                    </div>

                    <!-- Empty -->
                    <div id="typesEmptyState" class="text-center py-16 bg-surface-card rounded-lg border border-dashed border-border hidden">
                        <i class="fas fa-sliders text-4xl text-text-muted mb-4"></i>
                        <p class="text-text-primary font-semibold mb-2">No request types yet</p>
                        <p class="text-text-muted mb-4">Create one to describe how a kind of request moves through your team.</p>
                        <button id="createFirstTypeBtn" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary-600">
                            <i class="fas fa-plus mr-2"></i>New Type
                        </button>
                    </div>

                    <!-- Types grid -->
                    <div id="typesGrid" class="grid grid-cols-1 xl:grid-cols-2 gap-4"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- Type editor modal -->
    <div id="modalContainer" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center hidden" style="z-index: 2000;">
        <div class="modal bg-surface-card rounded-lg shadow-xl max-w-3xl w-full mx-4 max-h-[92vh] overflow-hidden">
            <div class="modal-header flex items-center justify-between px-6 py-4 border-b border-border">
                <h3 id="modalTitle" class="text-xl font-semibold text-text-primary">New Request Type</h3>
                <button class="modal-close text-text-muted hover:text-text-primary transition-colors" id="modalClose">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="modal-body overflow-y-auto px-6 py-4 max-h-[calc(92vh-120px)]" id="modalBody"></div>
        </div>
    </div>

    <script defer src="../../components/global-loading.js"></script>
    <script defer src="../../assets/js/config.js"></script>
    <script defer src="../../assets/js/toast.js"></script>
    <script defer src="../../assets/js/dashboard/utils.js"></script>
    <script defer src="../../assets/js/dashboard/api.js"></script>
    <script defer src="../../assets/js/requests/request-types.js"></script>
    <script defer src="../../components/sidebar-manager.js"></script>
    <script defer src="../../components/navbar.js"></script>
    <script defer src="../../assets/js/dashboard/dashboard.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (typeof initRequestTypes === 'function') {
                initRequestTypes();
            }
        });
    </script>
</body>

</html>
