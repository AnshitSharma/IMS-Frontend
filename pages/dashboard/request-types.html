<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' https://ims.bdcms.bharatdatacenter.com;">
    <title>Request Types - BDC Inventory</title>
    <link rel="stylesheet" href="../../assets/css/tailwind.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script>
        (function () {
            const theme = (localStorage.getItem('theme') || 'light').replace(/^"|"$/g, '');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        /* Request types — the "Types" board's layout (type list + flow of step
           cards) in the Refined theme. Plain CSS on the theme variables: the
           Tailwind build is hand-compiled, and the variables carry dark mode. */
        .rtx {
            --rtx-accent: #0F766E; --rtx-accent-ink: #0C5D57; --rtx-accent-soft: #E6F2F0; --rtx-sel: #F2FBF9;
            --rtx-red: #B91C1C; --rtx-red-soft: #FDECEC;
            color: var(--color-text-primary); font-size: 14px;
            display: flex; gap: 20px; align-items: flex-start;
        }
        [data-theme="dark"] .rtx {
            --rtx-accent: #2DD4BF; --rtx-accent-ink: #5EEAD4; --rtx-accent-soft: rgba(45, 212, 191, .12); --rtx-sel: rgba(45, 212, 191, .07);
            --rtx-red: #F87171; --rtx-red-soft: rgba(248, 113, 113, .12);
        }
        [data-theme="dark"] .rtx input, [data-theme="dark"] .rtx select, [data-theme="dark"] .rtx textarea { color-scheme: dark; }
        /* These rules set display, and load after tailwind.css, so they would
           otherwise beat its .hidden; JS hides things with that class. */
        .rtx .hidden, .rtx.hidden { display: none !important; }
        .rtx-mono { font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }
        .rtx-card { background: var(--color-surface-card); border: 1px solid var(--color-border); border-radius: 10px; }
        .rtx-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-muted); }

        .rtx-nav { flex: 0 0 260px; padding: 12px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 16px; max-height: calc(100vh - 120px); overflow-y: auto; }
        .rtx-nav .rtx-label { padding: 4px 10px 10px; }
        .rtx-nav-item {
            display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; border: 0; border-radius: 8px;
            background: transparent; color: var(--color-text-primary); font: inherit; text-align: left; cursor: pointer; width: 100%;
        }
        .rtx-nav-item:hover { background: var(--color-surface-hover); }
        .rtx-nav-item.is-on { background: var(--rtx-sel); box-shadow: inset 3px 0 0 var(--rtx-accent); }
        .rtx-nav-item.is-archived .rtx-nav-name { color: var(--color-text-muted); }
        .rtx-nav-name { font-weight: 500; overflow-wrap: anywhere; }
        .rtx-nav-meta { font-size: 11.5px; color: var(--color-text-muted); }
        .rtx-nav-new { color: var(--rtx-accent); font-weight: 500; }

        .rtx-main { flex: 1 1 0; min-width: 0; }
        .rtx-editor { display: flex; flex-direction: column; gap: 20px; }
        .rtx-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .rtx-top h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -.01em; overflow-wrap: anywhere; }
        .rtx-badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
        .rtx-badge.is-active { background: var(--rtx-accent-soft); color: var(--rtx-accent-ink); }
        .rtx-badge.is-archived, .rtx-badge.is-system { background: var(--color-surface-secondary); color: var(--color-text-secondary); }
        .rtx-top-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
        .rtx-btn {
            height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--color-border);
            background: var(--color-surface-card); color: var(--color-text-primary);
            font: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer;
            display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; text-decoration: none;
        }
        .rtx-btn:hover { background: var(--color-surface-hover); }
        .rtx-btn:disabled { opacity: .5; cursor: default; }
        .rtx-btn i { font-size: 12px; }
        .rtx-btn-icon { width: 36px; padding: 0; justify-content: center; color: var(--color-text-secondary); }
        .rtx-btn-primary { border-color: transparent; background: #0F766E; color: #fff; }
        .rtx-btn-primary:hover { background: #0C5D57; }
        .rtx-btn-danger { color: var(--rtx-red); }
        .rtx-btn-danger:hover { background: var(--rtx-red-soft); }
        .rtx button:focus-visible, .rtx a:focus-visible { outline: 2px solid #0F766E; outline-offset: 2px; }

        .rtx-details { padding: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
        .rtx-span { grid-column: 1 / -1; }
        .rtx-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
        .rtx-field > label, .rtx-field > .rtx-flabel { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); }
        .rtx input[type="text"], .rtx select, .rtx textarea {
            width: 100%; min-height: 38px; border: 1px solid var(--color-border); border-radius: 8px; padding: 0 10px;
            font: inherit; font-size: 13.5px; color: var(--color-text-primary); background: var(--color-surface-card);
        }
        .rtx textarea { padding: 8px 10px; line-height: 1.45; resize: vertical; }
        .rtx input:focus, .rtx select:focus, .rtx textarea:focus { outline: none; border-color: #0F766E; box-shadow: 0 0 0 3px rgba(15, 118, 110, .15); }
        .rtx input[readonly] { border-style: dashed; color: var(--color-text-muted); }
        .rtx-hint { font-size: 12px; color: var(--color-text-muted); line-height: 1.45; }
        .rtx-checks { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13.5px; }
        .rtx-checks label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
        .rtx input[type="checkbox"] { width: 15px; height: 15px; accent-color: #0F766E; }

        .rtx-sec-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
        .rtx-flowwrap { display: flex; align-items: stretch; flex-wrap: wrap; gap: 16px 0; }
        .rtx-flow { display: contents; }
        .rtx-step {
            position: relative; width: 260px; padding: 16px; margin-right: 34px;
            display: flex; flex-direction: column; gap: 12px;
            background: var(--color-surface-card); border: 1px solid var(--color-border); border-radius: 10px; cursor: default;
        }
        .rtx-step.is-on { border-color: var(--rtx-accent); box-shadow: 0 0 0 1px var(--rtx-accent); }
        .rtx-step::after {
            content: '→'; position: absolute; right: -24px; top: 50%; transform: translateY(-50%);
            font-family: 'IBM Plex Mono', ui-monospace, monospace; color: var(--color-text-muted); font-size: 16px;
        }
        .rtx-step-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .rtx-step-n { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; font-weight: 500; color: var(--rtx-accent); }
        .rtx-step-tools { display: flex; gap: 2px; }
        .rtx-step-tools button {
            width: 26px; height: 26px; border: 0; border-radius: 6px; background: transparent; color: var(--color-text-muted); cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; font-size: 11px;
        }
        .rtx-step-tools button:hover { background: var(--color-surface-hover); color: var(--color-text-primary); }
        .rtx-step-tools .stage-remove:hover { background: var(--rtx-red-soft); color: var(--rtx-red); }
        .rtx-owner { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 6px; }
        .rtx-does {
            border: 0; background: none; padding: 0; text-align: left; cursor: pointer;
            font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11.5px; color: var(--color-text-muted);
        }
        .rtx-does.is-acts { color: var(--rtx-accent); }
        .rtx-does:hover { text-decoration: underline; }
        .rtx-step .stage-effect { display: none; }
        .rtx-add {
            width: 150px; min-height: 200px; border: 1px dashed var(--color-border-dark); border-radius: 10px; background: transparent;
            color: var(--rtx-accent); font: inherit; font-weight: 500; cursor: pointer;
        }
        .rtx-add:hover { background: var(--rtx-sel); }

        .rtx-effect { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .rtx-effect .stage-effect > div { border: 0 !important; background: none !important; padding: 0 !important; }
        .rtx-effect .stage-effect .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 8px; }
        .rtx-effect .stage-effect label:has(.stage-action) {
            padding: 10px 12px; border: 1px solid var(--color-border); border-radius: 8px; cursor: pointer; font-size: 13px;
        }
        .rtx-effect .stage-effect label:has(.stage-action:checked) { border-color: var(--rtx-accent); background: var(--rtx-sel); }
        .rtx-effect .stage-effect code { display: block; font-size: 11px; margin-top: 2px; }
        .rtx-effect .stage-effect-on + * { }

        @media (max-width: 1023px) {
            .rtx { flex-direction: column; }
            .rtx-nav { position: static; flex: none; width: 100%; max-height: none; }
        }
        @media (max-width: 640px) {
            .rtx-details { grid-template-columns: minmax(0, 1fr); }
            .rtx-step { width: 100%; margin-right: 0; margin-bottom: 30px; }
            .rtx-step::after { content: '↓'; right: auto; left: 50%; top: auto; bottom: -26px; transform: translateX(-50%); }
            .rtx-add { width: 100%; min-height: 64px; }
        }
    </style>
</head>

<body class="bg-surface-main">
    <div id="navbar-placeholder"></div>

    <div class="layout-wrapper">
        <div class="main-container flex">
            <div id="sidebar-placeholder"></div>

            <main class="main-content flex-1 p-4 sm:p-6">
                <div id="pipelineTypesView" class="content-section active">
                    <!-- Loading -->
                    <div id="typesLoadingState" class="text-center py-12 hidden">
                        <i class="fas fa-spinner fa-spin text-3xl text-primary mb-4"></i>
                        <p class="text-text-muted">Loading request types...</p>
                    </div>

                    <!-- Error -->
                    <div id="typesErrorState" class="text-center py-12 bg-surface-card rounded-lg border border-border hidden">
                        <i class="fas fa-exclamation-triangle text-3xl text-danger mb-4"></i>
                        <p class="text-text-primary font-semibold mb-2">Couldn't load request types</p>
                        <p id="typesErrorMessage" class="text-text-muted mb-4"></p>
                        <button type="button" onclick="requestTypesManager.load()" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary-600">Try again</button>
                    </div>

                    <!-- Empty -->
                    <div id="typesEmptyState" class="text-center py-16 bg-surface-card rounded-lg border border-dashed border-border hidden">
                        <p class="text-text-primary font-semibold mb-2">No request types yet</p>
                        <p class="text-text-muted mb-4">Create one to describe how a kind of request moves through your team.</p>
                        <button type="button" id="createFirstTypeBtn" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary-600">
                            <i class="fas fa-plus mr-2"></i>New type
                        </button>
                    </div>

                    <!-- Type list + editor -->
                    <div id="typesGrid" class="rtx hidden">
                        <nav class="rtx-card rtx-nav" aria-label="Request types">
                            <div class="rtx-label">Request types</div>
                            <div id="typesNav"></div>
                            <button type="button" id="createTypeBtn" class="rtx-nav-item rtx-nav-new">+ New type</button>
                            <a href="requests.html" class="rtx-nav-item rtx-nav-meta" style="text-decoration:none">← Back to requests</a>
                        </nav>
                        <div class="rtx-main" id="typeEditor"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script defer src="../../components/global-loading.js"></script>
    <script defer src="../../assets/js/config.js"></script>
    <script defer src="../../assets/js/toast.js"></script>
    <script defer src="../../assets/js/dashboard/utils.js"></script>
    <script defer src="../../assets/js/dashboard/api.js"></script>
    <script defer src="../../assets/js/requests/request-types.js"></script>
    <script defer src="../../components/sidebar-manager.js"></script>
    <script defer src="../../components/navbar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (typeof initRequestTypes === 'function') {
                initRequestTypes();
            }
        });
    </script>
</body>

</html>
