<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' https://ims.bdcms.bharatdatacenter.com;">
    <title>Rack View - BDC Inventory</title>
    <link rel="stylesheet" href="../../assets/css/tailwind.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@700&family=JetBrains+Mono:wght@400;500&display=swap">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script>
        (function () {
            const theme = (localStorage.getItem('theme') || 'light').replace(/^"|"$/g, '');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        /* ============================================================
           Rack View — the datacenter elevation is the signature element.
           Self-contained styles (rk-*) so JS-generated markup never
           depends on Tailwind's compiled utility set.
           ============================================================ */
        /* ---- rack list cards ---- */
        .rk-rackcard {
            width: 100%;
            text-align: left;
            border: 1px solid var(--rk-card-border, #e5e7eb);
            background: var(--rk-card-bg, #ffffff);
            border-radius: 12px;
            padding: 0.85rem 0.95rem;
            transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
            cursor: pointer;
        }
        .rk-rackcard:hover { border-color: #14b8a6; box-shadow: 0 4px 14px rgba(20, 184, 166, .12); }
        .rk-rackcard:focus-visible { outline: 2px solid #14b8a6; outline-offset: 2px; }
        .rk-rackcard.is-active {
            border-color: #14b8a6;
            box-shadow: inset 3px 0 0 #14b8a6, 0 4px 14px rgba(20, 184, 166, .14);
            background: var(--rk-card-active, #f0fdfa);
        }

        /* ---- occupancy bar ---- */
        .rk-occ { height: 6px; border-radius: 999px; background: var(--rk-occ-track, #e5e7eb); overflow: hidden; }
        .rk-occ__fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #2dd4bf, #0d9488); transition: width .35s ease; }

        /* ---- the cabinet ("C · Chassis" elevation) ----
           Follows the theme: a pale steel cabinet in light, the dark one in
           dark. Every colour is a variable set on .rk-cabinet, so the two
           themes differ only in the token block below. Every entry (a server,
           a device, an enclosure, an empty U) is absolutely positioned on a
           pitch of one U plus a 2px gap, so a 2U box is exactly two rows tall. */
        .rk-cabinet {
            --rk-u: 24px;
            --rk-gap: 3px;
            --rk-pitch: calc(var(--rk-u) + var(--rk-gap));
            --rk-ink: #1A2129;
            --rk-dim: #66727F;
            --rk-faint: #8D98A4;
            --rk-meta: #5B6672;
            --rk-accent: #0E7490;
            --rk-accent-wash: rgba(14, 116, 144, .07);
            --rk-shell: #FFFFFF;
            --rk-shell-edge: #D9DEE3;
            --rk-box: #EEF1F4;
            --rk-box-edge: #CBD2D9;
            --rk-rail-a: #C3CBD3;
            --rk-slot-edge: #D0D7DE;
            --rk-sled: #FFFFFF;
            --rk-sled-edge: #C9D1D9;
            --rk-sled-hover: #F6F8FA;
            --rk-sled-hover-edge: #9AA6B2;
            --rk-sled-picked: #ECF8FB;
            --rk-bay-sled: #F7F9FB;
            --rk-bay-sled-edge: #CDD5DD;
            --rk-bay-edge: #CFD6DD;
            --rk-orphan-edge: rgba(220, 38, 38, .45);
            width: min(100%, 660px);
            display: flex; flex-direction: column; gap: 14px;
            padding: 20px;
            background: var(--rk-shell);
            border: 1px solid var(--rk-shell-edge);
            border-radius: 10px;
            color: var(--rk-ink);
            font-family: 'IBM Plex Sans', system-ui, sans-serif;
        }
        [data-theme="dark"] .rk-cabinet {
            --rk-ink: #E6EAEE;
            --rk-dim: #6B7785;
            --rk-faint: #4F5A66;
            --rk-meta: #8A96A3;
            --rk-accent: #4CC9F0;
            --rk-accent-wash: rgba(76, 201, 240, .06);
            --rk-shell: #0E1114;
            --rk-shell-edge: #1F252C;
            --rk-box: #0A0C0E;
            --rk-box-edge: #2A323B;
            --rk-rail-a: #1A2026;
            --rk-slot-edge: #252C34;
            --rk-sled: #1A2026;
            --rk-sled-edge: #29313A;
            --rk-sled-hover: #1E252C;
            --rk-sled-hover-edge: #3B4651;
            --rk-sled-picked: #10232B;
            --rk-bay-sled: #222932;
            --rk-bay-sled-edge: #313B45;
            --rk-bay-edge: #2F3842;
            --rk-orphan-edge: rgba(255, 107, 107, .45);
        }
        .rk-mono, .rk-cabinet .rk-mono {
            font-family: 'JetBrains Mono', ui-monospace, "SFMono-Regular", "Menlo", "Consolas", monospace;
            font-variant-numeric: tabular-nums;
        }
        .rk-cabinet__plate { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
        .rk-cabinet__name {
            font-family: 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif;
            font-size: 26px; font-weight: 700; line-height: 1.1; text-transform: uppercase;
            overflow-wrap: anywhere;
        }
        .rk-cabinet__meta { font-size: 12px; color: var(--rk-meta); }

        /* the box: rail | U labels + entries | rail */
        .rk-rack {
            display: flex; gap: 8px;
            padding: 12px 10px;
            background: var(--rk-box);
            border: 1px solid var(--rk-box-edge);
            border-radius: 6px;
        }
        .rk-rail {
            flex: none; width: 10px; border-radius: 2px;
            background: repeating-linear-gradient(var(--rk-rail-a) 0 3px, var(--rk-box) 3px 6px);
        }
        .rk-grid { position: relative; flex: 1 1 auto; min-width: 0; }

        .rk-ulabel {
            position: absolute; left: 0; width: 30px;
            padding-top: 7px; text-align: right;
            font-size: 10px; line-height: 1; color: var(--rk-faint);
            pointer-events: none;
        }
        /* every entry sits right of the label column */
        .rk-slot, .rk-sled, .rk-encl { position: absolute; left: 40px; right: 0; }

        /* empty U — a place-here target */
        .rk-slot {
            display: flex; align-items: center; justify-content: flex-end;
            padding: 0 12px;
            background: transparent;
            border: 1px dashed var(--rk-slot-edge); border-radius: 3px;
            color: var(--rk-faint); font-size: 11px; cursor: pointer;
            transition: border-color .12s ease, color .12s ease, background .12s ease;
        }
        .rk-slot:hover { border-color: var(--rk-accent); color: var(--rk-accent); background: var(--rk-accent-wash); }
        .rk-slot:focus-visible { outline: 2px solid var(--rk-accent); outline-offset: 1px; color: var(--rk-accent); }
        .rk-slot__hint { pointer-events: none; }

        /* a server or network device */
        .rk-sled {
            display: flex; align-items: center; gap: 12px;
            padding: 0 12px;
            background: var(--rk-sled);
            border: 1px solid var(--rk-sled-edge); border-radius: 3px;
            color: var(--rk-ink); font-size: 13px; cursor: pointer; overflow: hidden;
            transition: border-color .12s ease, background .12s ease;
        }
        .rk-sled:hover { border-color: var(--rk-sled-hover-edge); background: var(--rk-sled-hover); }
        .rk-sled.is-selected { border-color: var(--rk-accent); background: var(--rk-sled-picked); }
        .rk-sled:focus-visible { outline: 2px solid var(--rk-accent); outline-offset: 1px; }
        .rk-sled__led { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--st); }
        .rk-sled__name { flex: 1 1 auto; min-width: 3rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rk-sled__meta { flex: 0 1 auto; min-width: 0; max-width: 45%; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; color: var(--rk-dim); }

        /* blade enclosure: a rail naming the box, then its bays as a grid.
           Row-major grid order IS the backend's 1-based slot numbering, so
           there is no offset arithmetic to get wrong -- see
           RackEnclosure::slotGeometry(). */
        .rk-encl {
            display: flex; align-items: stretch;
            background: var(--rk-sled);
            border: 1px solid var(--rk-sled-edge); border-radius: 3px;
            overflow: hidden;
        }
        .rk-encl.is-selected { border-color: var(--rk-accent); }
        .rk-encl__rail {
            flex: 0 0 42%; min-width: 0;
            display: flex; align-items: center; gap: 10px;
            padding: 0 12px; text-align: left;
            background: transparent; border: 0; border-right: 1px solid var(--rk-sled-edge);
            color: var(--rk-ink); font-size: 13px; cursor: pointer;
            --st: var(--rk-meta);
        }
        .rk-encl__rail:hover { background: var(--rk-sled-hover); }
        .rk-encl__rail:focus-visible { outline: 2px solid var(--rk-accent); outline-offset: -2px; }
        .rk-encl__name { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rk-encl__meta { flex: none; font-size: 11px; color: var(--rk-dim); }
        .rk-encl__bays { flex: 1 1 0; min-width: 0; display: grid; gap: 3px; padding: 3px; }

        /* an empty bay */
        .rk-encl__bay {
            display: flex; align-items: center; justify-content: center;
            min-width: 0; border-radius: 2px;
            border: 1px dashed var(--rk-bay-edge); background: transparent;
            color: var(--rk-faint); font-size: 10px; cursor: pointer;
            transition: border-color .12s ease, color .12s ease;
        }
        .rk-encl__bay:hover { border-color: var(--rk-accent); color: var(--rk-accent); }
        .rk-encl__bay:focus-visible { outline: 2px solid var(--rk-accent); outline-offset: -2px; color: var(--rk-accent); }

        /* a sled inside a bay: a grid item, not a positioned strip */
        .rk-sled--bay {
            position: relative; left: auto; right: auto;
            min-width: 0; gap: 6px; padding: 0 7px;
            background: var(--rk-bay-sled); border-color: var(--rk-bay-sled-edge);
            font-size: 11px;
        }
        .rk-sled--bay .rk-sled__led { width: 6px; height: 6px; }
        .rk-sled--bay .rk-sled__name { min-width: 0; }

        /* ---- enclosure bay roster (the "what is inside this FX2s" list) ----
           Hand-written rather than Tailwind: `last:border-b-0` and
           `hover:underline` are not in the compiled tailwind.css, and that file
           is build output that must not be hand-edited. */
        .rk-roster__row { border-bottom: 1px solid var(--color-border, rgba(148, 163, 184, .25)); }
        .rk-roster__row:last-child { border-bottom: 0; }
        .rk-roster__link { text-decoration: none; }
        .rk-roster__link:hover { text-decoration: underline; }

        /* status LEDs — deeper hues on light surfaces, the glowing ones on dark.
           Also used by the legend and the detail panel, so set per theme, not
           per cabinet. */
        .st-draft     { --st: #7A8592; }
        .st-validated { --st: #D97706; }
        .st-built     { --st: #16A34A; }
        .st-finalized { --st: #0891B2; }
        .st-device    { --st: #7C3AED; }
        .st-orphaned  { --st: #DC2626; }
        [data-theme="dark"] .st-draft     { --st: #8A96A3; }
        [data-theme="dark"] .st-validated { --st: #F5A524; }
        [data-theme="dark"] .st-built     { --st: #3DDC97; }
        [data-theme="dark"] .st-finalized { --st: #4CC9F0; }
        [data-theme="dark"] .st-device    { --st: #B39DFF; }
        [data-theme="dark"] .st-orphaned  { --st: #FF6B6B; }
        .rk-sled.st-orphaned { border-color: var(--rk-orphan-edge); }

        /* legend */
        .rk-legend { display: flex; flex-wrap: wrap; gap: 14px; }
        .rk-legend__item { display: inline-flex; align-items: center; gap: 7px; font-size: .74rem; color: var(--rk-legend-text, #6b7280); }
        .rk-legend__dot { width: 8px; height: 8px; border-radius: 50%; background: var(--st); }

        /* status pill on rack cards */
        .rk-badge { display: inline-flex; align-items: center; gap: 5px; font-size: .68rem; padding: 2px 8px; border-radius: 999px; background: var(--rk-badge-bg, #f3f4f6); color: var(--rk-badge-text, #4b5563); }

        /* dark theme: lift the cabinet so it doesn't merge with the page */
        [data-theme="dark"] {
            --rk-card-bg: #1f2937; --rk-card-border: #374151; --rk-card-active: #0f2e2a;
            --rk-occ-track: #374151; --rk-badge-bg: #374151; --rk-badge-text: #d1d5db;
            --rk-legend-text: #9ca3af;
        }

        @media (max-width: 640px) {
            .rk-cabinet { padding: 14px; }
            .rk-cabinet__name { font-size: 22px; }
            .rk-sled__meta, .rk-encl__meta { display: none; }
            .rk-encl__rail { flex-basis: 36%; }
        }
        @media (prefers-reduced-motion: reduce) {
            .rk-rackcard, .rk-occ__fill, .rk-slot, .rk-sled, .rk-encl__rail, .rk-encl__bay { transition: none; }
        }
    </style>
</head>

<body class="bg-surface-main">
    <div id="navbar-placeholder"></div>

    <!-- Main Container with Layout Wrapper -->
    <div class="layout-wrapper">
        <div class="main-container flex">
            <div id="sidebar-placeholder"></div>

            <main class="main-content flex-1 p-4 sm:p-6">
                <!-- Page header -->
                <div class="content-header mb-6">
                    <div class="flex flex-wrap items-end justify-between gap-3">
                        <div>
                            <h2 class="text-2xl font-bold text-text-primary">Rack View</h2>
                            <p class="text-sm text-text-muted mt-1">Map your racks and see the servers installed in each U.</p>
                        </div>
                        <button id="newRackBtn"
                            class="btn btn-primary px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary-600 transition-colors flex items-center gap-2">
                            <i class="fas fa-plus"></i> New rack
                        </button>
                    </div>
                </div>

                <!-- Master / detail -->
                <div class="grid grid-cols-1 lg:grid-cols-[300px_minmax(0,1fr)] gap-5 items-start">
                    <!-- Rack list -->
                    <aside class="bg-surface-card rounded-xl border border-border p-3">
                        <div class="flex items-center justify-between px-1 pb-2 mb-1 border-b border-border-light">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-text-muted">Racks</h3>
                            <span id="rackCountChip" class="rk-badge">0</span>
                        </div>
                        <div id="rackListContainer" class="flex flex-col gap-2 max-h-[70vh] overflow-y-auto pr-1">
                            <!-- rack cards injected here -->
                        </div>
                    </aside>

                    <!-- Detail -->
                    <section class="min-w-0">
                        <!-- empty / no selection -->
                        <div id="rackDetailEmpty" class="bg-surface-card rounded-xl border border-border p-10 text-center">
                            <i class="fas fa-server text-4xl text-text-muted mb-3"></i>
                            <p class="text-text-primary font-semibold mb-1">No rack selected</p>
                            <p class="text-text-muted text-sm">Pick a rack on the left, or create one to start mapping your datacenter.</p>
                        </div>

                        <!-- selected rack -->
                        <div id="rackDetail" class="hidden">
                            <!-- toolbar -->
                            <div class="bg-surface-card rounded-xl border border-border p-4 mb-4">
                                <div class="flex flex-wrap items-start justify-between gap-3">
                                    <div class="min-w-0">
                                        <h3 id="detailRackName" class="text-xl font-bold text-text-primary truncate">Rack</h3>
                                        <div class="flex flex-wrap items-center gap-2 mt-1 text-sm text-text-muted">
                                            <span id="detailRackLocation" class="inline-flex items-center gap-1"><i class="fas fa-location-dot"></i> —</span>
                                            <span class="text-border">·</span>
                                            <span id="detailRackOccText" class="rk-mono">0 / 0U</span>
                                        </div>
                                        <div class="rk-occ mt-2 w-48 max-w-full"><div id="detailRackOccBar" class="rk-occ__fill" style="width:0%"></div></div>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <button id="placeServerBtn" class="px-3 py-2 bg-primary text-white rounded-lg hover:bg-primary-600 transition-colors text-sm flex items-center gap-2">
                                            <i class="fas fa-plus"></i> Place server
                                        </button>
                                        <button id="addEnclosureBtn" class="px-3 py-2 border border-border rounded-lg hover:bg-surface-hover transition-colors text-sm text-text-primary flex items-center gap-2" title="Install a blade enclosure">
                                            <i class="fas fa-layer-group"></i> Add enclosure
                                        </button>
                                        <button id="placeDeviceBtn" class="px-3 py-2 border border-border rounded-lg hover:bg-surface-hover transition-colors text-sm text-text-primary flex items-center gap-2" title="Rack a router, switch or MUX">
                                            <i class="fas fa-sitemap"></i> Place network device
                                        </button>
                                        <button id="editRackBtn" class="px-3 py-2 border border-border rounded-lg hover:bg-surface-hover transition-colors text-sm text-text-primary" title="Edit rack">
                                            <i class="fas fa-pen"></i>
                                        </button>
                                        <button id="deleteRackBtn" class="px-3 py-2 border border-border rounded-lg hover:bg-surface-hover transition-colors text-sm text-danger" title="Delete rack">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <!-- elevation + legend -->
                            <div class="bg-surface-card rounded-xl border border-border p-4 sm:p-6">
                                <div id="rackElevation" class="overflow-x-auto flex justify-center py-2">
                                    <!-- cabinet injected here -->
                                </div>
                                <div class="rk-legend mt-5 pt-4 border-t border-border-light justify-center">
                                    <span class="rk-legend__item st-draft"><span class="rk-legend__dot"></span> Draft</span>
                                    <span class="rk-legend__item st-validated"><span class="rk-legend__dot"></span> Validated</span>
                                    <span class="rk-legend__item st-built"><span class="rk-legend__dot"></span> Built</span>
                                    <span class="rk-legend__item st-finalized"><span class="rk-legend__dot"></span> Finalized</span>
                                    <span class="rk-legend__item st-device"><span class="rk-legend__dot"></span> Network device</span>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </main>
        </div>
    </div>

    <!-- Reusable modal -->
    <div id="rackModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center hidden p-4" style="z-index: 2000;">
        <div class="bg-surface-card rounded-xl shadow-xl max-w-lg w-full max-h-[90vh] overflow-hidden">
            <div class="flex items-center justify-between px-6 py-4 border-b border-border">
                <h3 id="rackModalTitle" class="text-lg font-semibold text-text-primary">Modal</h3>
                <button id="rackModalClose" class="text-text-muted hover:text-text-primary transition-colors" aria-label="Close">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div id="rackModalBody" class="overflow-y-auto px-6 py-5 max-h-[calc(90vh-70px)]">
                <!-- modal content injected here -->
            </div>
        </div>
    </div>


    <!-- Scripts -->
    <script defer src="../../components/global-loading.js"></script>
    <script defer src="../../assets/js/config.js"></script>
    <script defer src="../../assets/js/toast.js"></script>
    <script defer src="../../assets/js/dashboard/utils.js"></script>
    <script defer src="../../assets/js/dashboard/api.js"></script>
    <script defer src="../../assets/js/rack/rack-api.js"></script>
    <script defer src="../../assets/js/rack/rack-view.js"></script>
    <!-- Sidebar Component and Manager (must load before dashboard) -->
    <script defer src="../../components/sidebar-manager.js"></script>
    <script defer src="../../components/navbar.js"></script>
</body>

</html>
