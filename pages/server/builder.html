<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' https://ims.bdcms.bharatdatacenter.com;">
    <title>Server Builder - BDC IMS</title>
    <link rel="stylesheet" href="../../assets/css/tailwind.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body class="bg-surface-main">
    <!-- Shared Navigation Header -->
    <div id="navbar-placeholder"></div>

    <!-- Main Container with Layout Wrapper -->
    <div class="layout-wrapper">
        <div class="main-container flex">
            <!-- Sidebar Content Area (injected here via sidebar-placeholder) -->
            <div id="sidebar-placeholder"></div>

        <!-- Main Content -->
        <main class="main-content flex-1 p-4 sm:p-6">
            <div class="content-section active">
                <div class="content-header flex flex-wrap items-center justify-between gap-3 mb-6">
                    <!-- id matches the embedded builder's heading in pages/dashboard/servers.html
                         so ServerBuilder fills in the server name and serial on both pages. -->
                    <h2 id="serverBuilderTitle" class="text-2xl font-bold text-text-primary flex items-center gap-2">
                        <i class="fas fa-tools text-primary"></i> Server Builder
                    </h2>
                    <div class="header-actions">
                        <button
                            class="btn btn-secondary px-4 py-2 bg-surface-hover text-text-secondary rounded-lg hover:bg-border transition-colors flex items-center gap-2"
                            onclick="window.location.href='../dashboard/servers.html'">
                            <i class="fas fa-arrow-left"></i> Back to List
                        </button>
                    </div>
                </div>

                <!-- App Container. Deliberately empty: ServerBuilder shows the global
                     loading overlay while it fetches, then renders in here. A static
                     spinner of its own put a second animation on screen behind the
                     overlay's blur. -->
                <div id="app"></div>
            </div>
        </main>
    </div>
    </div>

    <!-- Modal Container -->
    <div id="modalContainer"
        class="modal-overlay fixed inset-0 bg-black/50 flex items-center justify-center z-modal hidden">
        <div class="modal bg-surface-card rounded-lg shadow-xl max-w-6xl w-full mx-4 max-h-[90vh] overflow-hidden">
            <div class="modal-header flex items-center justify-between px-6 py-4 border-b border-border">
                <h3 id="modalTitle" class="text-xl font-semibold text-text-primary">Modal Title</h3>
                <button class="modal-close text-text-muted hover:text-text-primary transition-colors" id="modalClose">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="modal-body overflow-y-auto px-6 py-4 max-h-[calc(90vh-120px)]" id="modalBody">
                <!-- Modal content will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Alert Container -->
    <div id="alertContainer" class="alert-container"></div>

    <!-- Scripts -->
    <!-- Axios 1.6.0, served from this origin. [L-01] It came from
         cdn.jsdelivr.net until 2026-09-13; the copy in assets/vendor was
         downloaded and its SHA-384 checked against the integrity attribute
         that was already here, so it is the same reviewed bytes with one
         fewer party able to change them. The integrity attribute stays:
         it now guards against the file being altered in our own tree. -->
    <script src="../../components/global-loading.js"></script>
    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/toast.js"></script>
    <script src="../../assets/js/dashboard/utils.js"></script>
    <script src="../../assets/js/dashboard/api.js"></script>
    <!-- Sidebar Component and Manager (must load before other scripts) -->
    <script src="../../components/sidebar-manager.js"></script>
    <script src="../../components/navbar.js"></script>
    <script src="../../assets/js/server/server-api.js?v=6"></script>
    <script src="../../assets/js/server/build-state.js?v=1"></script>
    <!-- Required by template-manager.js: it installs through window.componentInstaller.
         The platform picker no longer does -- a platform is installed by one backend call. -->
    <script src="../../assets/js/server/component-installer.js?v=1"></script>
    <script src="../../assets/js/server/template-manager.js?v=4"></script>
    <script src="../../assets/js/server/platform-manager.js?v=3"></script>
    <script src="../../assets/js/server/server-builder.js?v=8"></script>
</body>

</html>
