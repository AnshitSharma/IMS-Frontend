<link rel="stylesheet" href="../../assets/css/tailwind.css">
<link rel="stylesheet" href="../../assets/css/component-drawer.css">

<!-- Edit component. Opened in dashboard.openDrawer(); requests.js embeds it in
     its own modal instead, and edit-form.js then hides the head and footer. -->
<form id="editComponentForm" class="cd">
    <div class="cd-head">
        <div class="cd-head-text">
            <span id="formComponentType" class="cd-eyebrow">Component</span>
            <h2 id="formTitle">Edit component</h2>
        </div>
        <button type="button" class="cd-close" data-drawer-close aria-label="Close">
            <i class="fas fa-times" aria-hidden="true"></i>
        </button>
    </div>
    <div id="formFields" class="cd-body">
        <!-- Fields are rendered by edit-form.js -->
    </div>
    <div class="cd-foot form-actions">
        <span id="editChangeCount" class="cd-count" aria-live="polite">No changes</span>
        <button type="button" class="cd-btn" id="cancelEditComponent">Discard</button>
        <button type="submit" class="cd-btn cd-btn-primary" id="saveComponentBtn" disabled>Save changes</button>
    </div>
</form>
